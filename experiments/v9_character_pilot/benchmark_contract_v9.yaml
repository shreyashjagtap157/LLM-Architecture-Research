  - serving.batch_size
  - serving.concurrency
  - serving.prompt_length_distribution
  - serving.output_length_distribution
  - serving.decoding_settings
  - serving.cache_policy_revision
  - serving.generation_mode
  - serving.warmup_iterations
  - serving.measurement_iterations
  - serving.latency_definition
  P7:
  - serving.generation_modes
  - serving.mode_router_revision
  P8:
  - verification.draft_model_revision
  - verification.draft_geometry
  - verification.draft_checkpoint_sha256
  - verification.draft_tokenizer_sha256
  - verification.draft_config_sha256
  - verification.verifier_algorithm_revision
  - verification.state_commit_policy_revision
  - verification.proposal_probability_available
  - verification.target_checkpoint_sha256
  - verification.acceptance_correction_rule
  - verification.fidelity_test_revision
  - verification.fidelity_test_result
  - verification.fidelity_claim
  - verification.approximation_metric
  - verification.approximation_bound
  P9:
  - verification.draft_model_revision
  - verification.draft_geometry
  - verification.draft_checkpoint_sha256
  - verification.draft_tokenizer_sha256
  - verification.draft_config_sha256
  - verification.fidelity_claim=changed_output
  - evaluation.metrics[correct_token_retention]
  - evaluation.metrics[edit_damage_rate]
  - evaluation.metrics[correction_precision]
  - evaluation.metrics[correction_recall]
  - evaluation.metrics[refinement_convergence]
  - evaluation.metrics[correct_token_retention].value_kind=ratio
  - evaluation.metrics[correct_token_retention].numerator
  - evaluation.metrics[correct_token_retention].denominator
  - evaluation.metrics[edit_damage_rate].value_kind=ratio
  - evaluation.metrics[edit_damage_rate].numerator
  - evaluation.metrics[edit_damage_rate].denominator
  - evaluation.metrics[correction_precision].value_kind=ratio
  - evaluation.metrics[correction_precision].numerator
  - evaluation.metrics[correction_precision].denominator
  - evaluation.metrics[correction_recall].value_kind=ratio
  - evaluation.metrics[correction_recall].numerator
  - evaluation.metrics[correction_recall].denominator
  - evaluation.metrics[refinement_convergence].value_kind=ratio
  - evaluation.metrics[refinement_convergence].numerator
  - evaluation.metrics[refinement_convergence].denominator
  dirty_source_tree:
  - source.patch_sha256
  metric_value_kind_ratio:
  - evaluation.metrics[*].numerator
  - evaluation.metrics[*].denominator
revision_note: 'v9: run-identity paths are canonical paths into experiment_manifest.schema.json; dataset roles carry
  explicit use/right requirements; hardware/environment identity supports CPU-only, accelerator, heterogeneous,
  managed and bare-metal/container deployments. Conditional fields are scoped by run type/profile. Run-manifest
  self-hashes are externalized in a checksum sidecar to avoid circular hashing.'
