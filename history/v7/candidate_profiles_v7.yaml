  - '3:1'
  - '7:1'
  - front_loaded
  - back_loaded
  residual: standard_pre_norm
  ffn: dense
  kv_policy: full_cache
- id: P1-LA
  name: local_global_attention_control
  purpose: Compare local/global Transformer without recurrent state
  family: local_global_transformer
