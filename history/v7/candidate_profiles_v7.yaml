  promotion: required_reference
- id: P1
  name: recurrent_global_hybrid
  purpose: Measure recurrent/fast-weight sequence path
  family: hybrid_recurrent_attention
  recurrent_candidates:
  - GDN-2
  - Muir_preprint
  - Mamba-2
  - Mamba-3
  global_attention_schedule_candidates:
